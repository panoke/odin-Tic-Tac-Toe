<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>TOP - Tic Tac Toe</title>
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>
    <main>
        <div id="board">
            <button class="tiles" data-x="0" data-y="0" data-mark=""></button>
            <button class="tiles" data-x="1" data-y="0" data-mark="X" disabled>X</button>
            <button class="tiles" data-x="2" data-y="0" data-mark=""></button>
            <button class="tiles" data-x="0" data-y="1" data-mark=""></button>
            <button class="tiles" data-x="1" data-y="1" data-mark=""></button>
            <button class="tiles" data-x="2" data-y="1" data-mark=""></button>
            <button class="tiles" data-x="0" data-y="2" data-mark=""></button>
            <button class="tiles" data-x="1" data-y="2" data-mark=""></button>
            <button class="tiles" data-x="2" data-y="2" data-mark=""></button>
        </div>

        <button id="restartButton">Restart</button>
    </main>
    <footer>

    </footer>
</body>
</html>
